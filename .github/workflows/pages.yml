name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      newsletter_date: ${{ steps.newsletter.outputs.date }}
      newsletter_source: ${{ steps.newsletter.outputs.source }}
      newsletter_title: ${{ steps.newsletter.outputs.title }}
    env:
      DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_PARENT_SITE_API_URL: ${{ vars.GOOGLE_CONTENT_FEED_URL }}
      NEXT_PUBLIC_SITE_URL: https://corypahl.github.io/stm-parent
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report deployment input
        id: newsletter
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const latest = JSON.parse(fs.readFileSync("app/data/latest-newsletter.json", "utf8"));
          if (!latest?.title || !/^\d{4}-\d{2}-\d{2}$/.test(latest.newsletterDate || "") || !latest.sourceUrl) {
            throw new Error("latest-newsletter.json is missing a valid title, date, or source URL.");
          }
          const title = latest.title.replace(/[\r\n]+/g, " ").trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${latest.newsletterDate}\nsource=${latest.sourceUrl}\ntitle=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Deployment input\n- Latest newsletter: **${title}**\n- Newsletter date: **${latest.newsletterDate}**\n- Source: ${latest.sourceUrl}\n- Commit: \`${process.env.GITHUB_SHA}\`\n`);
          NODE

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:pages

      - name: Verify static export
        run: node --test tests/rendered-html.test.mjs

      - name: Verify expected newsletter is in the export
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const latest = JSON.parse(fs.readFileSync("app/data/latest-newsletter.json", "utf8"));
          const html = fs.readFileSync("dist/client/index.html", "utf8");
          if (!html.includes(latest.sourceUrl)) {
            throw new Error(`Static homepage does not contain the expected newsletter source ${latest.sourceUrl}.`);
          }
          console.log(`Verified ${latest.title} (${latest.newsletterDate}) in the static homepage.`);
          NODE

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/data/latest-newsletter.json
            app/data/google-newsletters.json
            app/data/newsletter-events.json
            app/data/calendar.json
            dist/client/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published newsletter
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ needs.build.outputs.newsletter_source }}
          EXPECTED_TITLE: ${{ needs.build.outputs.newsletter_title }}
          EXPECTED_DATE: ${{ needs.build.outputs.newsletter_date }}
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "${PUBLISHED_URL}?deploy=${GITHUB_SHA}" --output published-home.html && \
              node -e 'const fs=require("node:fs"); const html=fs.readFileSync("published-home.html","utf8"); if (!html.includes(process.env.EXPECTED_SOURCE)) process.exit(1);'; then
              echo "Verified ${EXPECTED_TITLE} (${EXPECTED_DATE}) on ${PUBLISHED_URL}."
              echo "### Published successfully" >> "$GITHUB_STEP_SUMMARY"
              echo "Verified **${EXPECTED_TITLE}** (${EXPECTED_DATE}) on ${PUBLISHED_URL}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Published page does not show the expected newsletter yet (attempt $attempt of 5)."
            sleep 10
          done
          echo "The deployment completed, but the published homepage does not contain ${EXPECTED_SOURCE}." >&2
          exit 1

      - name: Upload published-page diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-page-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: published-home.html
